name: Main-Version taggen

# Laeuft automatisch bei jedem Push auf main, der fuxtools.user.js aendert (also nach jedem
# gemergten Release-PR). Legt einen Git-Tag mit der @version aus fuxtools.user.js an (z.B.
# "v1.0.0"), falls dieser Tag noch nicht existiert - Tags werden nie ueberschrieben oder
# geloescht, damit jede jemals veroeffentlichte main-Version dauerhaft ueber ihren Tag
# erreichbar bleibt, auch wenn main spaeter weiterzieht.
on:
  push:
    branches: [main]
    paths: [fuxtools.user.js]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: main auschecken
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Version auslesen und taggen, falls neu
        run: |
          VERSION=$(grep -m1 -oP '@version\s+\K[0-9.]+' fuxtools.user.js)
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits, nichts zu tun."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Main-Release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG erstellt."
