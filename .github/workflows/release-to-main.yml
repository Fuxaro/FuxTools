name: Main-Release vorbereiten

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Welcher Versions-Teil erhöht wird (x.y.z)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: main auschecken
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Nächste Version berechnen
        run: |
          CURRENT=$(grep -m1 -oP '@version\s+\K[0-9]+\.[0-9]+\.[0-9]+' fuxtools.user.js)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=release/v$VERSION" >> "$GITHUB_ENV"
          echo "main-Version bisher: $CURRENT -> neue Version: $VERSION (Bump: ${{ inputs.bump }})"

      - name: Privates Beta-Repo als Remote hinzufügen und main-Stand dazuholen
        run: |
          if [ -z "${{ secrets.BETA_REPO_TOKEN }}" ]; then
            echo "::error::Secret BETA_REPO_TOKEN fehlt."
            exit 1
          fi
          git remote add betarepo "https://x-access-token:${{ secrets.BETA_REPO_TOKEN }}@github.com/Fuxaro/FuxTools-Beta.git"
          git -c http.https://github.com/.extraheader= fetch --depth 1 betarepo main

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Release-Branch von main abzweigen und Beta-Stand einspielen
        run: |
          git checkout -b "$BRANCH"
          cp -r .github/workflows /tmp/main-workflows
          cp -r scripts /tmp/main-scripts
          git rm -rf . > /dev/null
          git checkout betarepo/main -- .
          rm -rf .github/workflows
          cp -r /tmp/main-workflows .github/workflows
          rm -rf scripts
          cp -r /tmp/main-scripts scripts
          rm -f CHANGELOG.md CLAUDE.md
          sed -i -E "s/@version(\s+)\S+/@version\1$VERSION/" fuxtools.user.js
          grep -qE "^// @version\s+$VERSION$" fuxtools.user.js || {
            echo "::error::@version-Zeile nach dem Ersetzen nicht wie erwartet (sollte $VERSION sein)."
            grep -m1 '@version' fuxtools.user.js
            exit 1
          }

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: fuxtools.user.js auf main-Stand bringen
        run: |
          node scripts/strip-comments.js /tmp/fuxtools.stripped.js
          node scripts/set-stable-channel.js /tmp/fuxtools.stripped.js fuxtools.user.js
          node -c fuxtools.user.js
          grep -m1 '@version' fuxtools.user.js

      - name: Release-Branch committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote remove betarepo
          git add -A
          if git diff --cached --quiet; then
            echo "Kein Unterschied zu main - nichts zu releasen."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "Main-Release v$VERSION: Kommentare entfernt, Kanal auf stable"
          git push --force origin "$BRANCH"

      - name: Pull Request gegen main erstellen
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          PR_ERROR=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Main-Release v$VERSION" \
            --body "Automatisch erzeugter Release-PR aus dem Beta-Repo (v$VERSION).

          Bitte den Diff vor dem Merge kurz gegenprüfen - erst nach dem Merge ziehen sich Stable-Nutzer die neue Version." 2>&1)
          STATUS=$?
          set -e
          echo "$PR_ERROR"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          if echo "$PR_ERROR" | grep -qi "already exists"; then
            exit 0
          fi
          echo "::error::Pull Request konnte nicht erstellt werden."
          exit 1
