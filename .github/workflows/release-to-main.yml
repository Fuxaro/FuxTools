name: Main-Release vorbereiten

# Nur manuell auslösbar (Button "Run workflow" im Actions-Tab) - kein automatischer Trigger,
# damit main weiterhin nur dann aktualisiert wird, wenn das tatsächlich gewollt ist. Nimmt den
# aktuellen Stand aus dem PRIVATEN Beta-Repo (Fuxaro/FuxTools-Beta, Branch main) und bringt ihn
# auf main-Stand hier in diesem (öffentlichen) Repo: interne Entwickler-Kommentare raus
# (scripts/strip-comments.js), kosmetisches Kanal-Label auf "stable" umgestellt
# (scripts/set-stable-channel.js - @updateURL/@downloadURL zeigen ohnehin schon auf main, es gibt
# keinen öffentlichen beta-Branch als eigenen Auto-Update-Kanal mehr). CHANGELOG.md ist ein rein
# internes Beta-Repo-Dokument (Notizen für uns) und landet deshalb NIE auf main - wird nach dem
# Einspielen des Beta-Stands explizit wieder entfernt (siehe unten). Das Ergebnis landet als Pull
# Request gegen main, damit der
# Diff vor dem Live-Gehen bei den Stable-Nutzern noch gegengeprüft werden kann - kein direkter
# Push. CLAUDE.md (interne Arbeitsanweisungen fuer die KI, kein Nutzer-Dokument) landet aus
# demselben Grund wie CHANGELOG.md nie auf main.
#
# Beta-Entwicklung läuft im privaten Repo Fuxaro/FuxTools-Beta, damit interne Entwickler-
# Kommentare/Zwischenstände nicht öffentlich einsehbar sind. Dieser Workflow braucht deshalb
# Lesezugriff auf ein FREMDES (privates) Repo - dafür reicht der eingebaute GITHUB_TOKEN nicht,
# er gilt nur für DIESES Repo. Notwendig ist ein Secret BETA_REPO_TOKEN in den
# Repo-Einstellungen dieses (öffentlichen) Repos (Settings > Secrets and variables > Actions >
# "New repository secret"): ein Personal Access Token (fine-grained empfohlen) mit
# "Contents: Read" auf Fuxaro/FuxTools-Beta. Ohne dieses Secret schlägt der Fetch-Schritt unten
# mit einem Auth-Fehler fehl.
#
# WICHTIG: Der Release-Branch wird bewusst von main (nicht vom Beta-Repo) abgezweigt und bekommt
# DANACH den kompletten Beta-Inhalt aufgespielt - nicht andersrum. main und das Beta-Repo
# enthalten fuxtools.user.js dauerhaft in unterschiedlichen "Übersetzungen" (main = kommentarlos/
# stable-Kanal, Beta-Repo = kommentiert/beta-Kanal), und das Beta-Repo bekommt diese Übersetzung
# nie zurückgespielt. Ein Release-Branch direkt vom Beta-Stand abgezweigt hätte bei JEDEM Release
# erneut genau dieselben Zeilen (Versions-Header, CHANNEL-Konstante) unabhängig vom letzten
# main-Release umgeschrieben - Git meldete das beim Zurückmergen zuverlässig als Konflikt, weil
# beide Seiten (main vom letzten Mal, der neue Release-Branch jetzt) dieselbe Stelle unabhängig
# voneinander verändert hatten. Mit main als Basis ist der neue Commit stattdessen ein einfacher
# Kind-Commit von mains aktuellem Stand - der Merge danach hat nichts mehr gegenzuprüfen.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: main auschecken (Basis für den Release-Branch)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Privates Beta-Repo als Remote hinzufügen und main-Stand dazuholen
        run: |
          if [ -z "${{ secrets.BETA_REPO_TOKEN }}" ]; then
            echo "::error::Secret BETA_REPO_TOKEN fehlt - siehe Kommentar oben im Workflow für die Einrichtung (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          git remote add betarepo "https://x-access-token:${{ secrets.BETA_REPO_TOKEN }}@github.com/Fuxaro/FuxTools-Beta.git"
          # actions/checkout hinterlässt ein lokales http.https://github.com/.extraheader
          # mit dem eingebauten GITHUB_TOKEN - das gilt für JEDE github.com-URL, überschreibt
          # also sonst hier stillschweigend die im Remote-URL eingebetteten Zugangsdaten von
          # BETA_REPO_TOKEN. Da GITHUB_TOKEN keinen Zugriff auf das private Beta-Repo hat,
          # meldet GitHub das als "Repository not found" statt als Auth-Fehler. Für DIESEN
          # einen Fetch wird der Header deshalb gezielt geleert (spätere Schritte, z. B. der
          # Push gegen origin, brauchen ihn weiterhin unverändert).
          git -c http.https://github.com/.extraheader= fetch --depth 1 betarepo main

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Release-Branch von main abzweigen und kompletten Beta-Stand einspielen
        run: |
          VERSION=$(git show betarepo/main:fuxtools.user.js | grep -m1 -oP '@version\s+\K[0-9.]+')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=release/v$VERSION" >> "$GITHUB_ENV"
          git checkout -b "release/v$VERSION"
          # .github/workflows wird VORHER gesichert und HINTERHER unveraendert
          # zurueckkopiert: GitHub verweigert dem eingebauten GITHUB_TOKEN grundsaetzlich
          # jeden Push, der Dateien unter diesem Pfad aendert (Schutz gegen
          # Rechte-Eskalation, laesst sich nicht per permissions:-Block freischalten). Beide
          # Repos halten ihre Workflow-Dateien ohnehin manuell synchron, main behaelt hier
          # also einfach byte-identisch seinen eigenen Stand - dadurch entsteht dafuer gar
          # keine Aenderung, die gepusht werden muesste.
          cp -r .github/workflows /tmp/main-workflows
          git rm -rf . > /dev/null
          git checkout betarepo/main -- .
          rm -rf .github/workflows
          cp -r /tmp/main-workflows .github/workflows
          # CHANGELOG.md ist ein rein internes Beta-Repo-Dokument (Notizen fuer uns, keine
          # Nutzer-Doku) - kommt zwangslaeufig mit dem "git checkout betarepo/main -- ."
          # oben mit rein, gehoert aber NIE auf main. Wird deshalb hier wieder entfernt (git
          # add -A im Commit-Schritt weiter unten erfasst das als Loeschung). Gleiches gilt fuer
          # CLAUDE.md (interne Arbeitsanweisungen fuer die KI).
          rm -f CHANGELOG.md CLAUDE.md

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: fuxtools.user.js auf main-Stand bringen
        run: |
          node scripts/strip-comments.js /tmp/fuxtools.stripped.js
          node scripts/set-stable-channel.js /tmp/fuxtools.stripped.js fuxtools.user.js
          node -c fuxtools.user.js

      - name: Release-Branch committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote remove betarepo
          git add -A
          if git diff --cached --quiet; then
            echo "Kein Unterschied zu main - der Beta-Stand (v$VERSION) ist inhaltlich bereits identisch mit main, es gibt nichts zu releasen."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "Main-Release v$VERSION: Kommentare entfernt, Kanal auf stable"
          git push --force origin "$BRANCH"

      - name: Pull Request gegen main erstellen
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          PR_ERROR=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Main-Release v$VERSION" \
            --body "Automatisch erzeugter Release-PR aus dem privaten Beta-Repo (Fuxaro/FuxTools-Beta, main, v$VERSION).

          - Interne Entwickler-Kommentare entfernt (\`scripts/strip-comments.js\`)
          - Kanal-Label auf \`stable\` umgestellt (\`scripts/set-stable-channel.js\`)

          Bitte den Diff vor dem Merge kurz gegenprüfen - erst nach dem Merge ziehen sich Stable-Nutzer die neue Version." 2>&1)
          STATUS=$?
          set -e
          echo "$PR_ERROR"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          # "already exists" ist der einzige harmlose Fall (Workflow wurde fuer dieselbe
          # Version schon mal ausgeloest) - alles andere (z.B. fehlende Berechtigung) soll den
          # Job sichtbar rot fehlschlagen lassen statt es stillschweigend zu verschlucken.
          if echo "$PR_ERROR" | grep -qi "already exists"; then
            echo "Hinweis: PR existiert für diesen Branch bereits, wurde nicht neu angelegt."
            exit 0
          fi
          echo "::error::Pull Request konnte nicht erstellt werden - siehe Fehlermeldung oben (z.B. fehlt evtl. unter Settings > Actions > General > Workflow permissions die Option 'Allow GitHub Actions to create and approve pull requests')."
          exit 1
