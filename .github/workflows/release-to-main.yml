name: Main-Release vorbereiten

# Nur manuell auslösbar (Button "Run workflow" im Actions-Tab) - kein automatischer Trigger
# bei jedem Push auf beta, damit main weiterhin nur dann aktualisiert wird, wenn das
# tatsächlich gewollt ist. Nimmt den aktuellen beta-Stand und bringt ihn auf main-Stand:
# interne Entwickler-Kommentare raus (scripts/strip-comments.js), Kanal/Update-Links auf
# stable/main umgestellt (scripts/set-stable-channel.js), CHANGELOG.md "Beta"-Abschnitt wird
# zum neuen "Stable"-Abschnitt (scripts/promote-changelog.js). Das Ergebnis landet als Pull
# Request gegen main, damit der Diff vor dem Live-Gehen bei den Stable-Nutzern noch
# gegengeprüft werden kann - kein direkter Push.
#
# WICHTIG: Der Release-Branch wird bewusst von main (nicht von beta) abgezweigt und bekommt
# DANACH den kompletten beta-Inhalt aufgespielt - nicht andersrum. main und beta enthalten
# fuxtools.user.js/CHANGELOG.md nämlich dauerhaft in unterschiedlichen "Übersetzungen" (main =
# kommentarlos/stable-Kanal, beta = kommentiert/beta-Kanal), und beta bekommt diese Übersetzung
# nie zurückgespielt. Ein Release-Branch direkt von beta abgezweigt hätte bei JEDEM Release
# erneut genau dieselben Zeilen (Versions-Header, CHANNEL-Konstante, "## Beta"-Überschrift im
# Changelog) unabhängig vom letzten main-Release umgeschrieben - Git meldete das beim
# Zurückmergen zuverlässig als Konflikt, weil beide Seiten (main vom letzten Mal, der neue
# Release-Branch jetzt) dieselbe Stelle unabhängig voneinander verändert hatten. Mit main als
# Basis ist der neue Commit stattdessen ein einfacher Kind-Commit von mains aktuellem Stand -
# der Merge danach hat nichts mehr gegenzuprüfen.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: main auschecken (Basis für den Release-Branch)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: beta-Branch dazuholen
        run: git fetch --depth 1 origin beta

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Release-Branch von main abzweigen und kompletten beta-Stand einspielen
        run: |
          VERSION=$(git show origin/beta:fuxtools.user.js | grep -m1 -oP '@version\s+\K[0-9.]+')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BRANCH=release/v$VERSION" >> "$GITHUB_ENV"
          git checkout -b "release/v$VERSION"
          git rm -rf . > /dev/null
          git checkout origin/beta -- .

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: fuxtools.user.js auf main-Stand bringen
        run: |
          node scripts/strip-comments.js /tmp/fuxtools.stripped.js
          node scripts/set-stable-channel.js /tmp/fuxtools.stripped.js fuxtools.user.js
          node -c fuxtools.user.js

      - name: CHANGELOG.md auf main-Stand bringen
        run: |
          node scripts/promote-changelog.js CHANGELOG.md /tmp/CHANGELOG.main.md "$VERSION"
          mv /tmp/CHANGELOG.main.md CHANGELOG.md

      - name: Release-Branch committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Main-Release v$VERSION: Kommentare entfernt, Kanal auf stable, Changelog aktualisiert"
          git push --force origin "$BRANCH"

      - name: Pull Request gegen main erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          PR_ERROR=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Main-Release v$VERSION" \
            --body "Automatisch erzeugter Release-PR aus \`beta\` (v$VERSION).

          - Interne Entwickler-Kommentare entfernt (\`scripts/strip-comments.js\`)
          - Kanal auf \`stable\` umgestellt, \`@updateURL\`/\`@downloadURL\` auf \`main\` (\`scripts/set-stable-channel.js\`)
          - CHANGELOG.md aktualisiert: \`## Beta\`-Abschnitt wird zu \`## Stable (v$VERSION)\` (\`scripts/promote-changelog.js\`)

          Bitte den Diff vor dem Merge kurz gegenprüfen - erst nach dem Merge ziehen sich Stable-Nutzer die neue Version." 2>&1)
          STATUS=$?
          set -e
          echo "$PR_ERROR"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          # "already exists" ist der einzige harmlose Fall (Workflow wurde fuer dieselbe
          # Version schon mal ausgeloest) - alles andere (z.B. fehlende Berechtigung) soll den
          # Job sichtbar rot fehlschlagen lassen statt es stillschweigend zu verschlucken.
          if echo "$PR_ERROR" | grep -qi "already exists"; then
            echo "Hinweis: PR existiert für diesen Branch bereits, wurde nicht neu angelegt."
            exit 0
          fi
          echo "::error::Pull Request konnte nicht erstellt werden - siehe Fehlermeldung oben (z.B. fehlt evtl. unter Settings > Actions > General > Workflow permissions die Option 'Allow GitHub Actions to create and approve pull requests')."
          exit 1
